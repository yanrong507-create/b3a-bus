<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Next B3A · Fu Tai Estate → Shenzhen Bay Port</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffd400'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-size='24' font-weight='bold' text-anchor='middle' fill='%230b1220'%3EB3A%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #070e1b;
    --panel: #101c33;
    --panel-strong: #172945;
    --text: #f4f7fb;
    --muted: #93a2bd;
    --accent: #ffd400;
    --accent-soft: rgba(255, 212, 0, 0.12);
    --line: rgba(255, 255, 255, 0.08);
    --good: #4ade80;
    --warn: #fbbf24;
    --bad: #f87171;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue",
      Arial, "PingFang HK", "Noto Sans TC", sans-serif;
    background:
      radial-gradient(1100px 620px at 50% -12%, #1a3868 0%, rgba(7, 14, 27, 0) 62%),
      var(--bg);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    width: min(430px, 100%);
    padding: 24px;
    border: 1px solid var(--line);
    border-radius: 28px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.015));
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .route {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .badge {
    flex: none;
    padding: 5px 12px;
    border-radius: 10px;
    background: var(--accent);
    color: #111a2b;
    font-size: 27px;
    font-weight: 800;
    letter-spacing: 0.015em;
    line-height: 1.15;
    box-shadow: 0 6px 18px rgba(255, 212, 0, 0.16);
  }

  .operator {
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    flex: none;
    padding: 7px 11px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.03);
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.2s ease;
  }

  .status.live .dot {
    background: var(--good);
    box-shadow: 0 0 0 4px rgba(74, 222, 128, 0.13);
    animation: pulse 2.4s ease-in-out infinite;
  }

  .status.error .dot { background: var(--warn); box-shadow: 0 0 0 4px rgba(251, 191, 36, 0.13); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }

  h1 {
    margin: 22px 0 6px;
    font-size: 23px;
    line-height: 1.28;
    font-weight: 700;
    letter-spacing: -0.015em;
  }

  .arrow { color: var(--accent); padding: 0 2px; }

  .sub {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.5;
  }

  .board {
    margin-top: 22px;
  }

  .board-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin: 0 2px 10px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .board-head .hk {
    letter-spacing: 0.04em;
    font-weight: 600;
    text-transform: none;
    font-variant-numeric: tabular-nums;
  }

  .list {
    display: flex;
    flex-direction: column;
    gap: 9px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .bus {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    min-height: 86px;
    padding: 14px 18px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--panel);
    animation: rise 0.35s ease both;
  }

  .bus:nth-child(2) { animation-delay: 0.04s; }
  .bus:nth-child(3) { animation-delay: 0.08s; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: none; }
  }

  .bus.next {
    background: linear-gradient(135deg, #21457d 0%, #152b4c 62%, #152b4c 100%);
    border-color: rgba(255, 212, 0, 0.38);
    box-shadow: 0 12px 30px rgba(3, 9, 20, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.07);
  }

  .eta {
    display: flex;
    align-items: baseline;
    gap: 7px;
    min-width: 0;
  }

  .num {
    font-size: 42px;
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.035em;
    font-variant-numeric: tabular-nums;
  }

  .bus.next .num { font-size: 54px; }

  .num.due {
    font-size: 34px;
    letter-spacing: -0.01em;
    color: var(--accent);
  }

  .bus.next .num.due { font-size: 42px; }

  .unit {
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .num.due + .unit { display: none; }

  .meta {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 5px;
    text-align: right;
    min-width: 0;
  }

  .clock {
    font-size: 15px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: #dbe4f3;
  }

  .tag {
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.06);
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .bus.next .tag {
    background: var(--accent-soft);
    color: var(--accent);
  }

  .rmk {
    color: var(--warn);
    font-size: 11px;
    font-weight: 600;
    max-width: 180px;
  }

  .empty {
    padding: 28px 18px;
    border: 1px dashed rgba(255, 255, 255, 0.14);
    border-radius: 18px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.55;
    text-align: center;
  }

  .skeleton {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 86px;
    padding: 14px 18px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--panel);
  }

  .bar {
    display: block;
    height: 26px;
    border-radius: 8px;
    background: linear-gradient(90deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
    background-size: 220% 100%;
    animation: shimmer 1.4s linear infinite;
  }

  .bar.wide { width: 130px; }
  .bar.narrow { width: 64px; height: 14px; }

  @keyframes shimmer {
    from { background-position: 120% 0; }
    to { background-position: -120% 0; }
  }

  .notice {
    margin: 10px 2px 0;
    color: var(--warn);
    font-size: 12px;
    line-height: 1.5;
  }

  footer {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }

  .foot-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .updated {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.5;
  }

  .updated strong {
    color: #dbe4f3;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .refresh {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    flex: none;
    padding: 9px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.045);
    color: var(--text);
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }

  .refresh:hover { background: rgba(255, 255, 255, 0.09); border-color: rgba(255, 255, 255, 0.18); }
  .refresh:active { transform: scale(0.97); }
  .refresh:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .refresh[disabled] { opacity: 0.55; cursor: default; }

  .refresh svg {
    width: 13px;
    height: 13px;
    transition: transform 0.5s ease;
  }

  .refresh.loading svg { animation: spin 0.9s linear infinite; }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .progress {
    height: 2px;
    margin-top: 14px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.07);
    overflow: hidden;
  }

  .progress span {
    display: block;
    width: 0;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--accent), #ffe873);
  }

  .source {
    margin: 10px 0 0;
    color: #6f7f9b;
    font-size: 10.5px;
    line-height: 1.5;
    letter-spacing: 0.02em;
  }

  .source a {
    color: inherit;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  @media (max-width: 380px) {
    .app { padding: 20px; border-radius: 24px; }
    h1 { font-size: 21px; }
    .badge { font-size: 24px; }
    .num { font-size: 38px; }
    .bus.next .num { font-size: 48px; }
    .bus.next .num.due { font-size: 38px; }
    .rmk { max-width: 140px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <div class="route">
      <span class="badge">B3A</span>
      <span class="operator">Citybus</span>
    </div>
    <span class="status" id="status" role="status">
      <span class="dot"></span>
      <span id="statusText">Live</span>
    </span>
  </div>

  <h1>Fu Tai Estate <span class="arrow">→</span> Shenzhen Bay Port</h1>
  <p class="sub">富泰邨 → 深圳灣口岸 · Castle Peak Road</p>

  <section class="board" aria-labelledby="boardTitle">
    <div class="board-head">
      <span id="boardTitle">Next B3A departures</span>
      <span class="hk" id="hkClock">--:--</span>
    </div>
    <ul class="list" id="list" aria-live="polite" aria-busy="true">
      <li class="skeleton"><span class="bar wide"></span><span class="bar narrow"></span></li>
      <li class="skeleton"><span class="bar wide"></span><span class="bar narrow"></span></li>
    </ul>
    <p class="notice" id="notice" hidden></p>
  </section>

  <footer>
    <div class="foot-row">
      <div class="updated">
        Updated <strong id="updated">—</strong><br>
        <span id="refreshIn">Refreshing in 30s</span>
      </div>
      <button class="refresh" id="refresh" type="button" aria-label="Refresh bus times now">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
          <path d="M21 3v6h-6"></path>
        </svg>
        Refresh
      </button>
    </div>
    <div class="progress" aria-hidden="true"><span id="bar"></span></div>
    <p class="source">
      Live data from <a href="https://data.gov.hk" target="_blank" rel="noopener">DATA.GOV.HK</a> · Citybus ETA API
    </p>
  </footer>
</main>

<script>
(() => {
  'use strict';

  const ENDPOINT = 'https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/003261/B3A';
  const REFRESH_MS = 30000;
  const MAX_ROWS = 3;

  const list = document.getElementById('list');
  const status = document.getElementById('status');
  const statusText = document.getElementById('statusText');
  const notice = document.getElementById('notice');
  const updatedEl = document.getElementById('updated');
  const refreshInEl = document.getElementById('refreshIn');
  const hkClockEl = document.getElementById('hkClock');
  const barEl = document.getElementById('bar');
  const refreshBtn = document.getElementById('refresh');

  let buses = [];
  let fetchedAt = 0;
  let nextRefreshAt = 0;
  let lastLoadStart = 0;
  let errorMessage = '';
  let hasLoaded = false;
  let inFlight = false;

  const hkTime = new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Asia/Hong_Kong',
    hour: '2-digit',
    minute: '2-digit',
    hour12: false
  });

  const hkTimeWithSeconds = new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Asia/Hong_Kong',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: false
  });

  function minutesUntil(ms) {
    const diff = ms - Date.now();
    return diff < 60000 ? 0 : Math.floor(diff / 60000);
  }

  function formatClock(ms) {
    return hkTime.format(new Date(ms));
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, (ch) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
  }

  function render() {
    const now = Date.now();
    const rows = buses
      .filter((bus) => bus.ms > now - 60000)
      .slice(0, MAX_ROWS);

    status.classList.toggle('live', !errorMessage);
    status.classList.toggle('error', Boolean(errorMessage));
    statusText.textContent = errorMessage ? 'Retrying' : 'Live';
    refreshBtn.disabled = inFlight;
    refreshBtn.classList.toggle('loading', inFlight);

    updatedEl.textContent = fetchedAt ? hkTimeWithSeconds.format(new Date(fetchedAt)) : '—';

    let html = '';

    if (!hasLoaded) {
      html = '<li class="skeleton"><span class="bar wide"></span><span class="bar narrow"></span></li>' +
             '<li class="skeleton"><span class="bar wide"></span><span class="bar narrow"></span></li>';
    } else if (rows.length === 0) {
      html = '<li class="empty">' +
        (errorMessage
          ? 'Could not load bus times.<br>Check your connection — retrying automatically.'
          : 'No upcoming B3A buses right now.<br>Service may have ended for today.') +
        '</li>';
    } else {
      rows.forEach((bus, index) => {
        const mins = minutesUntil(bus.ms);
        const due = mins === 0;
        const tags = ['Next bus', 'Following', 'Later'];
        const tag = due ? 'Due now' : tags[index] || 'Later';
        const rmk = bus.rmk ? '<span class="rmk">' + escapeHtml(bus.rmk) + '</span>' : '';

        html += '<li class="bus' + (index === 0 ? ' next' : '') + '" data-ms="' + bus.ms + '">' +
          '<div class="eta">' +
            '<span class="num' + (due ? ' due' : '') + '">' + (due ? 'Due' : mins) + '</span>' +
            '<span class="unit">min</span>' +
          '</div>' +
          '<div class="meta">' +
            '<span class="clock">' + formatClock(bus.ms) + '</span>' +
            '<span class="tag">' + tag + '</span>' +
            rmk +
          '</div>' +
        '</li>';
      });
    }

    list.innerHTML = html;
    list.setAttribute('aria-busy', String(!hasLoaded));

    if (errorMessage) {
      notice.hidden = false;
      notice.textContent = fetchedAt
        ? 'Live connection lost — showing the last update while we retry.'
        : 'Unable to reach the Citybus ETA service — retrying every 30 seconds.';
    } else {
      notice.hidden = true;
      notice.textContent = '';
    }

    updateCountdown();
  }

  function updateCountdown() {
    const now = Date.now();
    hkClockEl.textContent = hkTime.format(new Date(now));

    const remaining = Math.max(0, nextRefreshAt - now);
    refreshInEl.textContent = inFlight
      ? 'Updating…'
      : 'Refreshing in ' + Math.ceil(remaining / 1000) + 's';

    const elapsed = lastLoadStart ? now - lastLoadStart : 0;
    const pct = lastLoadStart
      ? Math.min(100, Math.max(0, (elapsed / REFRESH_MS) * 100))
      : 0;
    barEl.style.width = pct + '%';

    list.querySelectorAll('li[data-ms]').forEach((row) => {
      const ms = Number(row.dataset.ms);
      const num = row.querySelector('.num');
      if (!num) return;
      const mins = minutesUntil(ms);
      const due = mins === 0;
      const text = due ? 'Due' : String(mins);
      if (num.textContent !== text) num.textContent = text;
      num.classList.toggle('due', due);
    });
  }

  async function load() {
    if (inFlight) return;
    inFlight = true;
    lastLoadStart = Date.now();
    render();

    try {
      const response = await fetch(ENDPOINT + '?t=' + Date.now(), { cache: 'no-store' });
      if (!response.ok) throw new Error('HTTP ' + response.status);

      const payload = await response.json();
      const data = Array.isArray(payload.data) ? payload.data : [];

      buses = data
        .filter((item) => item && item.eta)
        .filter((item) => item.dir === undefined || item.dir === 'O')
        .filter((item) => !item.dest_en || /shenzhen bay port/i.test(item.dest_en))
        .map((item) => ({
          ms: Date.parse(item.eta),
          rmk: item.rmk_en || ''
        }))
        .filter((item) => Number.isFinite(item.ms))
        .sort((a, b) => a.ms - b.ms);

      fetchedAt = Date.now();
      errorMessage = '';
    } catch (error) {
      errorMessage = error && error.message ? error.message : 'Network error';
      console.warn('B3A ETA request failed:', error);
    } finally {
      inFlight = false;
      hasLoaded = true;
      nextRefreshAt = Date.now() + REFRESH_MS;
      render();
    }
  }

  refreshBtn.addEventListener('click', () => {
    load();
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && Date.now() - fetchedAt > REFRESH_MS) {
      load();
    }
  });

  setInterval(() => {
    updateCountdown();
    if (!inFlight && Date.now() >= nextRefreshAt) {
      load();
    }
  }, 1000);

  load();
})();
</script>
</body>
</html>
